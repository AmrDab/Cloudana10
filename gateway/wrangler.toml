name = "cloudana-gateway"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

# Route: every *.cloudana.run request (the user-content domain, owned 2026-10-18) goes to this Worker. DNS needs one
# *proxied* wildcard record:  *  AAAA  100::  (owner step 8, docs/OWNER_RUNBOOK.md). Cloudflare's free Universal SSL
# certificate covers cloudana.run and *.cloudana.run (one level: every deployment id).
# Top-level key: it must stay above the [vars] table or TOML reads it as a variable.
routes = [
  { pattern = "*.cloudana.run/*", zone_name = "cloudana.run" }
]

[vars]
API_URL = "https://api.cloudana.io"
SITES_DOMAIN = "cloudana.run"

# Relayed deployments (docs/V4_RELAY_CONTRACT.md): each node's RelayNode in cloudana-relay (deploy that first).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayNode"
script_name = "cloudana-relay"

# Secret (same value as the API's): INTERNAL_API_KEY — set by scripts/set-relay-secrets.mjs (runbook step 8).
# SITES_DOMAIN is a separate registrable domain, so tenant apps can't touch cloudana.io cookies (docs/V4_REVIEW_RELAY.md §2).

# GPU endpoints (docs/V4_ENDPOINTS_CONTRACT.md): requests per endpoint key. The Workers rate-limiting binding
# (period 10 or 60 s); namespace_id is any integer unique within this Worker.
[[unsafe.bindings]]
name = "KEY_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }
