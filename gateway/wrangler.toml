name = "cloudana-gateway"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

# Route: every *.sites.cloudana.io request goes to this Worker once DNS has a *proxied* wildcard record
#   *.sites  AAAA  100::   (owner step, docs/OWNER_RUNBOOK.md) and the zone has a certificate covering *.sites.
# Top-level key: it must stay above the [vars] table or TOML reads it as a variable.
routes = [
  { pattern = "*.sites.cloudana.io/*", zone_name = "cloudana.io" }
]

[vars]
API_URL = "https://api.cloudana.io"
SITES_DOMAIN = "sites.cloudana.io"

# Relayed deployments (docs/V4_RELAY_CONTRACT.md): each node's RelayNode in cloudana-relay (deploy that first).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayNode"
script_name = "cloudana-relay"

# Secret (same value as the API's): wrangler secret put INTERNAL_API_KEY
# SITES_DOMAIN moves to the user-content domain (e.g. cloudana.run, one-level wildcard) once it exists
# (docs/V4_REVIEW_RELAY.md §2); *.sites.cloudana.io would need a paid certificate.
