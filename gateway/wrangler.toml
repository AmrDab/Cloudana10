name = "cloudana-gateway"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

[vars]
API_URL = "https://api.cloudana.io"
SITES_DOMAIN = "sites.cloudana.io"

# Route (owner step — see README.md). Uncomment once DNS has a *proxied* wildcard record
#   *.sites  CNAME/AAAA  (any proxied target, e.g. "100::" AAAA or cloudana.io CNAME)
# in the cloudana.io zone. Cloudflare then sends every *.sites.cloudana.io request to this Worker.
# routes = [
#   { pattern = "*.sites.cloudana.io/*", zone_name = "cloudana.io" }
# ]
