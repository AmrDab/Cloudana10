name: Build & push machine image

# Builds images/machine/Dockerfile (context = images/machine) and, on main, pushes it to GHCR as
# ghcr.io/<owner>/cloudana-machine:<version> (from images/machine/VERSION), :<major>.<minor>, :sha-<sha>.
# Mirrors build-node-agent.yml: signed with cosign (keyless, GitHub OIDC), SPDX SBOM attached, tags never moved, no
# :latest — client/api/src/services/deployment-spec.ts MACHINE_IMAGE pins the semver tag. Pull requests only build and
# run images/machine/smoke-test.sh under runc and under gVisor (runsc), with the flags the node agent uses.
#
# Verify a pulled image:
#   cosign verify ghcr.io/amrdab/cloudana-machine:1.0.0 \
#     --certificate-identity https://github.com/AmrDab/Cloudana10/.github/workflows/machine-image.yml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    branches: [main]
    paths:
      - "images/machine/**"
      - ".github/workflows/machine-image.yml"
  pull_request:
    paths:
      - "images/machine/**"
      - ".github/workflows/machine-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cloudana-machine

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version file
        run: grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' images/machine/VERSION || { echo "::error::images/machine/VERSION must be x.y.z"; exit 1; }

      - name: Build
        run: docker build -t cloudana-machine:check images/machine

      # gVisor as the README tells providers to install it (node-agent/README.md "gVisor sandbox").
      - name: Install gVisor (runsc)
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'

      - name: Smoke test (runc)
        run: bash images/machine/smoke-test.sh cloudana-machine:check runc

      - name: Smoke test (gVisor)
        run: bash images/machine/smoke-test.sh cloudana-machine:check runsc

  build:
    needs: check
    runs-on: ubuntu-latest
    # Publish only from main — workflow_dispatch can be fired from any branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version tags
        id: meta
        run: |
          ref="${IMAGE,,}"
          version="$(tr -d '[:space:]' < images/machine/VERSION)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version '$version'"; exit 1; }
          minor="${version%.*}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$ref:$version,$ref:$minor,$ref:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Login comes BEFORE the overwrite guard: unauthenticated, `manifest inspect` on a private package fails
      # for every tag, which would read as "not published" and let a released version be overwritten.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a released version
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.ref }}:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.meta.outputs.version }} is already published — bump images/machine/VERSION"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: images/machine
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.meta.outputs.ref }}@${{ steps.push.outputs.digest }}"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.ref }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: machine-sbom.spdx.json
          artifact-name: machine-${{ steps.meta.outputs.version }}-sbom.spdx.json
      - name: Attach the SBOM to the image
        env:
          COSIGN_YES: "true"
        run: cosign attest --type spdxjson --predicate machine-sbom.spdx.json "${{ steps.meta.outputs.ref }}@${{ steps.push.outputs.digest }}"
