name: Secret scan

# Every new commit is scanned for credentials before it lands (SECURITY_AUDIT.md, the March leak). Only the commits an
# event adds are scanned: the old history is public already and handled by rotation, not by rewriting it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets — gitleaks on new commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum verified)
        run: |
          set -euo pipefail
          v=8.21.2
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSfLO "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
      - name: Scan the new commits (values redacted in the log)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then range="-1 $PUSH_AFTER"
          else range="$PUSH_BEFORE..$PUSH_AFTER"; fi
          echo "scanning $range"
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="$range" .
