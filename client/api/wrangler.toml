name = "cloudana-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "api.cloudana.io", custom_domain = true }
]

[vars]
CHAIN_NETWORK = "baseSepolia"
# Hosted sites, containers and GPU endpoints answer at https://<id>.cloudana.run (cloudana-gateway).
SITES_DOMAIN = "cloudana.run"
USD_PER_CLD = "0.1"
# Public testnet: test credits (no value), once per wallet per day. Remove before CLD carries value.
TESTNET_CREDITS = "true"
# Economics (docs/IMPL_SPEC_2026-10.md). Price is the controller's initial/reset value, nCLD per TMAC.
PRICE_NUSD_PER_TMAC = "1400"
BASE_FEE_USD = "0.0001"
PRICE_CONTROLLER = "on"
EPOCH_SECONDS = "3600"
VEST_B_SECONDS = "3600"
SUBSIDY_RHO = "0.04"
EPOCH_SUBSIDY_BUDGET_UCLD = "7300000"
CLUSTER_N_MIN = "3"
CLUSTER_S_CAP = "0.5"
# Assignment seed source (jobs.service fetchSeedSource): the latest Base Sepolia block hash, so every draw is
# replayable by anyone from seed_source + job id (DECENTRALIZATION_ROADMAP.md phase 1). Unset, the seed falls back to
# "local:<ms>" and the draw cannot be checked by third parties. Public RPC; no key.
CHAIN_RPC_URL = "https://sepolia.base.org"

[[d1_databases]]
binding = "DB"
database_name = "cloudana-db"
database_id = "682f013a-90bb-4065-8787-2501ea3de81d"

[[kv_namespaces]]
binding = "CLOUDANA_KV"
id = "9b7d684cf36a4d7680b5c374d1228246"

# Node duties, price controller, deposit watcher (src/worker.ts scheduled()).
# Relay (docs/V4_RELAY_CONTRACT.md): probes reach relayed deployments through each node's RelayNode.
# Secret (same value on cloudana-relay): wrangler secret put RELAY_TICKET_SECRET
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayNode"
script_name = "cloudana-relay"

# Job artifacts (docs/V4_STORAGE_PHASE1_CONTRACT.md §A): finished jobs' matrices move here out of D1.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "cloudana-artifacts"

# Public, IP-keyed rate limits (ENGINEERING_BACKLOG B-25; src/middleware/rate-limit.ts): one binding per (limit, period)
# the shared buckets in src/middleware/security.ts use, named RL_<limit>_<period>; the key carries the bucket. The
# period can only be 10 or 60 s, so the hourly buckets (keys-create, fleets-create) stay in KV. namespace_id is any
# integer unique within this Worker.
[[unsafe.bindings]]
name = "RL_5_60"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_10_60"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_20_60"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "RL_30_60"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_60_60"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_120_60"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_240_60"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 240, period = 60 }

[triggers]
crons = ["* * * * *"]
