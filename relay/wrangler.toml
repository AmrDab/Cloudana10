# cloudana-relay — node WebSockets (docs/V4_RELAY_CONTRACT.md). Deployed rarely: a deploy drops every node socket.
name = "cloudana-relay"
main = "src/index.ts"
compatibility_date = "2025-04-01"
# Request.signal fires when the caller (gateway / API) goes away, so a stream is freed before its head arrives.
compatibility_flags = ["enable_request_signal"]
workers_dev = false
routes = [
  { pattern = "relay.cloudana.io", custom_domain = true }
]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayNode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayNode"]

# Secret (same value on cloudana-api): wrangler secret put RELAY_TICKET_SECRET
